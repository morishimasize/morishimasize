<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ひっさんノート</title>
<link rel="icon" href="icon.png?v=pop-a1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png?v=pop-a1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ひっさんノート">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
// Preserve bookmarks made before the home screen was introduced.
if (['answer','practice'].includes(new URLSearchParams(location.search).get('mode'))) location.replace('calculator.html'+location.search);
</script>
<link rel="stylesheet" href="home.css?v=feedback1">
</head>
<body>
<main class="home">
  <header class="brand">
    <span class="strawberry" aria-hidden="true">🍓</span>
    <h1>ひっさんノート</h1>
    <img src="assets/pencil-sticker.png" class="pencil" alt="" width="72" height="108">
  </header>
  <section class="notebook" aria-labelledby="welcome">
    <span class="tape" aria-hidden="true"></span>
    <h2 id="welcome">なにを しよう？</h2>
    <nav class="choices" aria-label="つかいかたを えらぶ">
      <a class="choice answer" href="calculator.html?mode=answer">
        <span class="choice-icon" aria-hidden="true">🧮</span>
        <span class="words"><strong>こたえを みる</strong><span>ときかたも わかるよ</span></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="choice practice" href="calculator.html?mode=practice">
        <span class="choice-icon" aria-hidden="true">✏️</span>
        <span class="words"><strong>じぶんで とく</strong><span>かいて、まるつけ</span></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="choice game" href="prototypes/full-notebook.html">
        <span class="choice-icon" aria-hidden="true">🧩</span>
        <span class="words"><strong>けいさんゲーム</strong><span>もんだいを といて、<br>えを かんせい！</span><span id="resume-hint" class="resume-hint" hidden>つづきから あそべるよ</span></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
    <p class="encouragement">じぶんの ペースで だいじょうぶ。</p>
  </section>
  <button type="button" id="feedback-settings" aria-haspopup="dialog">おとなの せってい</button>
  <dialog id="feedback-dialog" aria-labelledby="feedback-title">
    <h2 id="feedback-title">よみとりの きょうりょく</h2>
    <p>よみとりを なおしたとき、その 1けたの せんと、なおす まえと あとの すうじを おくります。</p>
    <p id="feedback-status" role="status"></p>
    <div id="feedback-enroll">
      <p><a id="feedback-setup" rel="noreferrer">この たんまつを とうろく</a></p>
      <form id="feedback-code-form">
        <label for="feedback-code">とうろく コード</label>
        <input id="feedback-code" required type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="64">
        <button type="submit">コードで オンにする</button>
      </form>
    </div>
    <p id="feedback-active" hidden>
      <button type="button" id="feedback-disable">じどうそうしんを とめる</button>
      <a id="feedback-manage" rel="noreferrer">かんりする</a>
    </p>
    <form method="dialog"><button type="submit">とじる</button></form>
  </dialog>
</main>
<script src="prototypes/notebook-save.js?v=screen-fit1"></script>
<script src="prototypes/recognition-tuning.js?v=1"></script>
<script src="prototypes/notebook-feedback.js?v=tuning1"></script>
<script src="home.js?v=feedback1"></script>
</body>
</html>
