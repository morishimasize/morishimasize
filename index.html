<!DOCTYPE html>
<!--
  更新日: 2026-06-08
  変更内容:
  - 計算入力画面の背景に keisan.PNG（文房具柄）を埋め込み
  - 解答画面の背景に kaitou.PNG（森・木）を埋め込み
  - タイトル・入力カード・筆算カードを半透明の白カードに変更
  - 画面切り替え時に body の背景も切り替わるよう JS を修正
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ひっさんマスター">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <title>ひっさんノート</title>
  <style>
    :root {
      --color-bg: #FFFDF0;
      --color-main: #FF8BA7;
      --color-sub: #A0E4FF;
      --color-text: #5F4B32;
      --color-focus: #FFF9C4;
    }
 
    body {
      background-image: none;
      background-size: cover;
      background-position: center 20%;
      background-attachment: fixed;
      font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color: var(--color-text);
      margin: 0;
      padding: 10px;
      touch-action: manipulation;
      transition: background-image 0.3s ease;
    }
    body.answer-mode {
      background-image: none;
    }

    #app {
      max-width: 800px;
      margin: 0 auto;
      padding-top: 24vh;
    }
    body.answer-mode #app {
      padding-top: 0;
    }
 
    /* ── 入力カード ── */
    .card {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
 
    .formula-bar { display: flex; align-items: center; gap: 10px; }
 
 .num-box {
      width: 190px; height: 100px;
      background: rgba(255,255,255,0.96);
      border: 4px solid #FFB3C6;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 26px;
      font-size: 58px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s;
      color: var(--color-text);
      box-shadow: 0 6px 0 #FFB3C6;
    }
    .num-box.active {
      border-color: #FBC02D;
      background: var(--color-focus);
      box-shadow: 0 5px 0 #F9A825;
      transform: scale(1.05);
    }
 
    /* ── 演算子ボタン ── */
    .op-group { display: flex; gap: 8px; }
 .op-btn {
      width: 70px; height: 70px;
      border: none; border-radius: 50%;
      background: linear-gradient(145deg, #B3E5FC, #81D4FA);
      color: #0277BD;
      font-size: 36px; font-weight: bold;
      box-shadow: 0 5px 0 #4FC3F7;
      cursor: pointer; transition: 0.15s;
    }
    .op-btn.active {
      background: linear-gradient(145deg, #4FC3F7, #0288D1);
      color: white;
      transform: translateY(3px);
      box-shadow: 0 2px 0 #0277BD;
    }
 
    /* ── キーパッド ── */
    .keypad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px; /* ボタン同士の隙間を広げて押し間違い防止 */
      width: 100%;
      max-width: 600px; /* 横幅を大きく */
    }
    .key {
      height: 80px;
      background: linear-gradient(180deg, #fff 60%, #FFF0F5);
      border: 2px solid #FFB3C6;
      border-radius: 18px;
      font-size: 38px; font-weight: bold;
      color: var(--color-text);
      box-shadow: 0 6px 0 #FFB3C6;
      cursor: pointer; transition: 0.1s;
    }
    .key:active { transform: translateY(5px); box-shadow: 0 1px 0 #FFB3C6; }
    .key-del {
      background: linear-gradient(180deg, #FFEBEE 60%, #FFCDD2);
      border: 2px solid #EF9A9A;
      color: #C62828;
      box-shadow: 0 6px 0 #EF9A9A;
      font-size: 30px;
    }
    .key-del:active { transform: translateY(5px); box-shadow: 0 1px 0 #EF9A9A; }
    .key-clr {
      background: linear-gradient(180deg, #EDE7F6 60%, #D1C4E9);
      border: 2px solid #B39DDB;
      color: #4A148C;
      box-shadow: 0 6px 0 #B39DDB;
      font-size: 26px;
    }
    .key-clr:active { transform: translateY(5px); box-shadow: 0 1px 0 #B39DDB; }
 
  /* ── ＝計算ボタン ── */
    .calc-btn {
      width: 100%; max-width: 600px;
      height: 80px;
      font-size: 28px; font-weight: bold;
      border: none; border-radius: 50px;
      background: linear-gradient(135deg, #FF8BA7, #FF4081);
      color: white;
      box-shadow: 0 8px 0 #C2185B;
      cursor: pointer; transition: 0.15s;
      text-shadow: 0 1px 2px rgba(0,0,0,0.15);
      letter-spacing: 1px;
    }
  .calc-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #C2185B; }
 
    /* ── けいさんにもどるボタン ── */
    .back-btn {
      width: 100%; max-width: 600px;
      height: 60px; margin-bottom: 15px;
      background: rgba(160,228,255,0.88); border: none; border-radius: 16px;
      font-size: 22px; font-weight: bold; color: var(--color-text);
      box-shadow: 0 6px 0 rgba(136,192,208,0.7); cursor: pointer; display: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .back-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #88C0D0; }
 
    /* ── エラーメッセージ ── */
    .em {
      min-height: 20px;
      font-size: 14px; color: #E91E63;
      text-align: center; font-weight: bold;
    }
 
    /* ── 筆算表示エリア ── */
    .hp {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 10px 15px;
      box-shadow: none;
      display: flex; flex-direction: column;
      align-items: center; min-height: 100px;
    }
    /* 筆算グリッド用小カード */
    .hp-grid-wrap {
      background: rgba(255,255,255,0.82);
      border-radius: 20px;
      padding: 20px 15px;
      margin-bottom: 14px;
      width: 100%; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(100,160,200,0.15);
    }
 
    /* ── 筆算グリッド共通 ── */
    .gc { display: grid; gap: 12px; align-items: center; justify-items: center; }
    .c  { width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 500; font-family: monospace; }
    .cv { color: var(--color-text); }
    .co { color: #78909C; font-size: 28px; }
    .ca { color: var(--color-main); font-size: 32px; font-weight: bold; }
    .cp { color: #90A4AE; font-size: 28px; }
    .cr { color: #BA7517; font-size: 28px; }
    .sc { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; font-family: monospace; }
    .scr { color: #BA7517; }
    .lb { font-size: 13px; text-align: center; width: 66px; display: flex; align-items: center; justify-content: center; }
 
    .hdr { font-size: 22px; margin-bottom: 18px; font-family: monospace; font-weight: bold; }
    .ans { color: var(--color-main) !important; font-weight: bold; font-size: 28px; }
 
    /* ── 手順解説カード ── */
    .step-card {
      display: flex; align-items: flex-start;
      gap: 10px; padding: 11px 12px;
      border-radius: 14px; margin-bottom: 8px;
      text-align: left; width: 100%;
      box-sizing: border-box;
      background: rgba(255,255,255,0.78) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .step-label {
      min-width: 60px; text-align: center;
      flex-shrink: 0; line-height: 1.4;
      font-size: 17px; font-weight: bold;
    }
    .step-label small { font-weight: normal; font-size: 13px; display: block; }
    .step-body { font-size: 19px; color: #5F4B32; line-height: 2.1; }

    /* 解答は桁幅を保ち、長い筆算だけを横スクロールさせる。 */
    body.answer-mode { padding: max(16px, env(safe-area-inset-top)) 12px 28px; }
    .hp { min-width: 0; box-sizing: border-box; }
    .back-btn { margin-left: auto; margin-right: auto; }
    .hp-grid-wrap {
      min-width: 0;
      background: rgba(255,255,255,0.96);
      border: 2px solid #E0EAD8;
      padding: 24px 16px;
    }
    .grid-scroll { width: 100%; min-width: 0; overflow-x: auto; padding: 4px 0 12px; }
    .grid-scroll .gc { width: max-content; margin-inline: auto; }
    .gc .c, .gc .sc { box-sizing: border-box; }
    .gc .lb { width: 100%; overflow-wrap: anywhere; }
    .grid-line { justify-self: stretch; height: 3px; background: #5F4B32; margin: 4px 0; }
    .division-rule { grid-column: 1 / -1; justify-self: stretch; position: relative; height: 3px; }
    .division-divisor { width: auto; min-width: 58px; padding-left: 8px; white-space: nowrap; }
    .division-digit { position: relative; border-top: 4px solid #5F4B32; }
    .division-digit::before { content: ''; position: absolute; top: -4px; left: -12px; width: 12px; border-top: 4px solid #5F4B32; }
    .hdr { text-align: center; max-width: 100%; overflow-wrap: anywhere; line-height: 1.6; }
    .steps-wrap { width: 100%; min-width: 0; padding-top: 4px; }
    .steps-title { font-size: 18px; text-align: center; margin: 8px 0 14px; }
    .step-card { background: rgba(255,255,255,0.96) !important; }
    .step-body { min-width: 0; overflow-wrap: anywhere; line-height: 1.8; }
    .step-label { min-width: 72px; }
    @media (max-width: 540px) {
      .hp { padding: 8px 0; }
      .hp-grid-wrap { padding: 18px 10px; }
      .step-card { flex-direction: column; gap: 6px; padding: 14px; }
      .step-label { text-align: left; }
      .step-label small { display: inline; margin-left: 10px; }
      .step-body { font-size: 18px; }
      .hdr, .ans { font-size: 20px; }
      .back-btn { font-size: 19px; }
    }

    /* 森のひっさんノート：入力と解答を同じ紙面でつなぐ */
    body { --color-main:#D84970; --color-text:#603F2C; --paper:#FFFEFC; background-color:#EFF8E8; }
    body, body.answer-mode {
      background-image: url("forest-notebook.png");
      background-size:cover; background-position:center; background-attachment:fixed; padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    #app,body.answer-mode #app { max-width:1180px; padding-top:0; position:relative; }
    .brand { text-align:center; margin:0 auto 22px; padding:0 160px; }
    .brand h1 { font-size:clamp(30px,4.6vw,54px); line-height:1.3; margin:0 0 8px; letter-spacing:.04em; font-weight:900; }
    .brand p { font-size:clamp(16px,2vw,22px); margin:0; font-weight:700; }
    .answer-subtitle { display:none; }
    .answer-mode .input-subtitle { display:none; }
    .answer-mode .answer-subtitle { display:block; }
    .pencil-icon { display:inline-block; transform:rotate(-12deg); font-size:.8em; }
    .notebook { position:relative; background-color:var(--paper); background-image:linear-gradient(#D8E9F066 1px,transparent 1px),linear-gradient(90deg,#D8E9F066 1px,transparent 1px); background-size:24px 24px; border:2px solid #E0EADD; border-radius:30px; box-shadow:0 8px 0 #D5E4C9,0 15px 35px #6A8B5C18; }
    .notebook::before { content:''; position:absolute; left:12px; top:32px; bottom:32px; width:20px; background:radial-gradient(circle at 10px 10px,#D5E2CD 0 7px,#ACBCA4 8px,transparent 9px) 0 0/20px 52px; pointer-events:none; }
    .notebook::after { content:''; position:absolute; width:90px; height:27px; left:28px; top:-9px; transform:rotate(-15deg); background:radial-gradient(white 1.6px,transparent 2px) 0 0/12px 12px,#F4AFC3DD; pointer-events:none; }
    .card.notebook { max-width:900px; margin:0 auto 20px; padding:32px 36px 28px 56px; gap:20px; box-sizing:border-box; }
    .formula-bar { width:100%; max-width:670px; justify-content:center; gap:18px; }
    .number-field { flex:1; min-width:0; text-align:center; }
    .number-field label { display:block; font-size:19px; font-weight:700; margin-bottom:10px; }
    .num-box { box-sizing:border-box; width:100%; height:100px; font-size:clamp(32px,4.5vw,58px); border-radius:24px; border:3px solid #F4A4BF; box-shadow:0 5px 0 #F2C3D1; background:#FFFFFFF5; font-family:inherit; font-variant-numeric:tabular-nums; }
    .num-box.active { border-color:#EABB16; background:#FFFBD9; box-shadow:0 5px 0 #E9CB64; transform:none; }
    #current-op { font-size:42px !important; padding-top:32px; color:var(--color-text) !important; }
    .op-group { gap:18px; }
    .op-btn { width:66px; height:66px; color:#714D3D; background:linear-gradient(#FFF4F7,#F9DCE6); box-shadow:0 4px 0 #EABFCF; border:2px solid #EFB9CE; }
    .op-btn.active { color:#215F83; background:linear-gradient(#DDF5FF,#AFE2FA); border-color:#64B2DE; box-shadow:0 4px 0 #76BBDC; transform:none; }
    .keypad { max-width:680px; gap:12px; }
    .key { height:70px; font-family:inherit; font-size:38px; border:2px solid #E4DAD3; background:linear-gradient(#FFF,#FFF9F9); box-shadow:0 4px 0 #DDD4CD; }
    .key:nth-child(even):not(.key-del):not(.key-clr) { background:linear-gradient(#FFF5F8,#FBE0E9); border-color:#F0C1D0; box-shadow:0 4px 0 #E8B9C9; }
    .key-del,.key-clr { font-size:22px; height:54px; margin-top:6px; }
    .key-del { background:#DCF3FC; border-color:#A9D4E8; color:#386D85; box-shadow:0 4px 0 #A9D4E8; }
    .key-clr { background:#EEE6FA; border-color:#CFBDE7; color:#72518E; box-shadow:0 4px 0 #CFBDE7; }
    .em:empty { display:none; }
    .em { font-size:18px; }
    .calc-btn { max-width:680px; height:70px; font-family:inherit; background:linear-gradient(#FC8EA8,#EE698B); box-shadow:0 6px 0 #D74E74; font-size:28px; }
    .input-hint { text-align:center; margin:8px 0; font-size:17px; color:#637C59; }
    body:not(.answer-mode) .hp { display:none; }
    .back-btn { position:absolute; top:6px; left:0; width:auto; max-width:none; height:auto; min-height:50px; padding:10px 18px; font-family:inherit; font-size:18px; background:#D6F0FD; box-shadow:0 4px 0 #9BCDE7; border-radius:24px; color:#396680; }
    .hp { padding:0; gap:20px; }
    .hdr { background:#FCE1E9; border:2px solid white; border-radius:40px; padding:8px 30px; margin:0; font-family:inherit; font-size:clamp(20px,2.8vw,30px); font-weight:900; box-sizing:border-box; }
    .hdr .ans { font-size:inherit; color:var(--color-text) !important; }
    .answer-book { width:100%; box-sizing:border-box; padding:32px 28px 24px 52px; }
    .answer-layout { display:grid; grid-template-columns:minmax(0,1fr); gap:24px; }
    .hp-grid-wrap { padding:0 0 20px; margin:0; border:none; background:transparent; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; border-radius:0; }
    .panel-title { display:table; margin:0 auto 24px; padding:7px 28px; border-radius:28px; background:#FCE3EB; text-align:center; font-size:24px; font-weight:900; }
    .steps-wrap { padding:0; }
    .grid-scroll { padding-top:6px; }
    .gc .c { font-size:36px; font-family:inherit; font-weight:700; border-radius:14px !important; }
    .gc .sc { font-size:19px; font-family:inherit; border-radius:9px !important; }
    .gc .ca { color:#C83F66; background:#FCE0E8 !important; border-color:#F5B7CA !important; font-weight:900; }
    .step-card { display:block; padding:16px 18px; margin-bottom:14px; border:2px solid var(--step-edge); border-left:2px solid var(--step-edge); border-radius:22px; background:var(--step-wash) !important; box-shadow:0 3px 0 #6A8B5C0A; backdrop-filter:none; -webkit-backdrop-filter:none; }
    .step-label { display:flex; align-items:center; gap:10px; min-width:0; text-align:left; margin-bottom:12px; color:var(--step-color); }
    .step-number { display:flex; flex:0 0 38px; height:38px; align-items:center; justify-content:center; background:var(--step-color); color:white; border-radius:50%; font-size:24px; }
    .step-label small { font-size:19px; font-weight:900; display:inline; }
    .step-body { padding:10px 12px; background:#FFFFFFB8; border-radius:14px; font-size:19px; line-height:1.9; }
    .answer-ribbon { display:flex; gap:12px; align-items:center; justify-content:center; text-align:center; margin-top:24px; padding:16px 24px; border-radius:26px; background:#FCE3EB; font-size:clamp(23px,3.2vw,36px); font-weight:900; overflow-wrap:anywhere; }
    .answer-ribbon .answer-value { color:#CD4269; font-size:1.3em; min-width:0; }
    .answer-star { color:#D4A51E; }
    button:focus-visible,.grid-scroll:focus-visible { outline:4px solid #418BA6; outline-offset:5px; }
    @media (min-width:900px) and (orientation:landscape) {
      .answer-layout { grid-template-columns:minmax(0,1fr) minmax(0,1.12fr); gap:28px; }
      .hp-grid-wrap { border-right:2px solid #C9DEE8; padding-right:28px; }
    }
    /* 縦長のタブレットは画面高を使い、入力ノートの下の空白を減らす。 */
    @media (min-width:701px) and (min-height:850px) and (orientation:portrait) {
      body:not(.answer-mode) #app {
        display:flex;
        flex-direction:column;
        height:calc(100vh - max(18px, env(safe-area-inset-top)) - max(28px, env(safe-area-inset-bottom)) - 16px);
        height:calc(100svh - max(18px, env(safe-area-inset-top)) - max(28px, env(safe-area-inset-bottom)) - 16px);
        min-height:780px;
      }
      body:not(.answer-mode) .brand { flex:none; }
      .card.notebook {
        flex:1;
        width:100%;
        margin-bottom:0;
        gap:clamp(18px,2vh,28px);
      }
      .card .formula-bar { flex:none; }
      .card .num-box { height:clamp(100px,12vh,160px); font-size:clamp(48px,5.5vw,68px); }
      .card .op-group { flex:none; }
      .card .op-btn { width:clamp(66px,8vh,100px); height:clamp(66px,8vh,100px); font-size:clamp(36px,4vw,48px); }
      .card .keypad {
        flex:1;
        min-height:230px;
        grid-template-rows:minmax(70px,1fr) minmax(70px,1fr) minmax(54px,.7fr);
        gap:16px;
      }
      .card .key { height:100%; min-height:70px; font-size:clamp(38px,5vw,58px); }
      .card .key-del,.card .key-clr { min-height:54px; margin-top:0; font-size:clamp(22px,2.8vw,30px); }
      .card .calc-btn { flex:none; height:clamp(70px,9vh,110px); font-size:clamp(28px,3.5vw,38px); }
    }
    @media (max-width:700px) {
      body,body.answer-mode { padding:16px 10px 28px; }
      .brand { padding:0; margin-bottom:20px; }
      .answer-mode .brand { padding-top:64px; }
      .brand h1 { font-size:32px; }
      .card.notebook { padding:28px 16px 24px 30px; gap:20px; }
      .notebook::before { left:5px; width:16px; background-size:16px 46px; background-position:-2px 0; }
      .formula-bar { gap:8px; }
      .number-field label { font-size:13px; }
      .num-box { height:76px; font-size:clamp(23px,5.5vw,38px); border-radius:18px; }
      #current-op { font-size:26px !important; padding-top:26px; }
      .op-group { gap:12px; }
      .op-btn { width:54px; height:54px; font-size:29px; }
      .keypad { gap:9px; }
      .key { height:60px; font-size:30px; border-radius:14px; }
      .key-del,.key-clr { font-size:16px; height:50px; }
      .calc-btn { font-size:23px; height:62px; }
      .answer-book { padding:28px 14px 20px 30px; }
      .panel-title { font-size:21px; padding:6px 20px; }
      .step-card { padding:12px; }
      .step-body { font-size:18px; padding:10px; }
      .answer-ribbon { padding:14px 12px; gap:8px; flex-wrap:wrap; }
      .hdr { padding:8px 18px; }
    }
  </style>
</head>
<body>
 
<div id="app">
  <header class="brand">
    <h1>ひっさんノート <span class="pencil-icon" aria-hidden="true">✏️</span></h1>
    <p class="input-subtitle">すうじを いれてみよう</p>
    <p class="answer-subtitle">いっしょに けいさんしよう</p>
  </header>
 
  <!-- 入力カード -->
  <div class="card notebook">
    <!-- 数字表示と演算子 -->
    <div class="formula-bar">
      <div class="number-field"><label id="label-n1">ひとつめの かず</label><button type="button" id="disp-n1" class="num-box active" aria-labelledby="label-n1 disp-n1" onclick="setTarget('n1')">0</button></div>
      <div id="current-op" style="font-size:28px; font-weight:bold; color:var(--color-main);">＋</div>
      <div class="number-field"><label id="label-n2">ふたつめの かず</label><button type="button" id="disp-n2" class="num-box" aria-labelledby="label-n2 disp-n2" onclick="setTarget('n2')">0</button></div>
    </div>
 
    <!-- 演算子ボタン -->
    <div class="op-group">
      <button class="op-btn active" onclick="setOp('+', this)">＋</button>
      <button class="op-btn"        onclick="setOp('-', this)">－</button>
      <button class="op-btn"        onclick="setOp('*', this)">×</button>
      <button class="op-btn"        onclick="setOp('/', this)">÷</button>
    </div>
 
    <!-- キーパッド -->
    <div class="keypad">
      <button class="key" onclick="pressNum(1)">1</button>
      <button class="key" onclick="pressNum(2)">2</button>
      <button class="key" onclick="pressNum(3)">3</button>
      <button class="key" onclick="pressNum(4)">4</button>
      <button class="key" onclick="pressNum(5)">5</button>
      <button class="key" onclick="pressNum(6)">6</button>
      <button class="key" onclick="pressNum(7)">7</button>
      <button class="key" onclick="pressNum(8)">8</button>
      <button class="key" onclick="pressNum(9)">9</button>
      <button class="key" onclick="pressNum(0)">0</button>
      <button class="key key-del" style="grid-column: span 2;" onclick="pressDel()">ひとつ けす</button>
      <button class="key key-clr" style="grid-column: span 3;" onclick="pressClr()">ぜんぶ けす</button>
    </div>
 
    <!-- エラーメッセージ -->
    <div class="em" id="em"></div>
 
    <!-- ＝ボタン -->
<button class="calc-btn" onclick="calc()">ひっさんを みる →</button>
  </div>
 
  <button id="back-btn" class="back-btn" onclick="backToInput()">← もどる</button>

  <div class="hp" id="hp">
    <div style="color:#9E8F7D; text-align:center; padding:20px;">
      すうじをいれて「ひっさんを みる」をおしてね！
    </div>
  </div>
</div>
 
<script>
  let gop = '+';
  let n1str = "", n2str = "", target = "n1";
  const CS = 58;
  const PLACE_NAMES = ['いち', 'じゅう', 'ひゃく', 'せん', 'まん', 'じゅうまん'];
  const STEP_COLORS = ['#185FA5', '#2E7D32', '#BA7517', '#6A1B9A', '#C62828'];
 
  // ─── 入力 UI ───────────────────────────────────────────────
 
  function setTarget(t) {
    target = t;
    document.getElementById("disp-n1").classList.toggle("active", t === "n1");
    document.getElementById("disp-n2").classList.toggle("active", t === "n2");
  }
 
  function setOp(opChar, btn) {
    gop = opChar;
    const signs = {'+':'＋', '-':'－', '*':'×', '/':'÷'};
    document.getElementById("current-op").innerText = signs[opChar];
    document.querySelectorAll(".op-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    setTarget("n2");
    document.getElementById("em").textContent = '';
  }
 
  function pressNum(num) {
    if (target === "n1") { if (n1str.length < 5) n1str += num; }
    else                  { if (n2str.length < 5) n2str += num; }
    updateDisplay();
  }
 
  function pressDel() {
    if (target === "n1") n1str = n1str.slice(0, -1);
    else                  n2str = n2str.slice(0, -1);
    updateDisplay();
  }
 
  function pressClr() {
    n1str = ""; n2str = "";
    document.getElementById("em").textContent = '';
    setTarget("n1");
    updateDisplay();
  }
 
  function updateDisplay() {
    document.getElementById("disp-n1").innerText = n1str || "0";
    document.getElementById("disp-n2").innerText = n2str || "0";
  }
 
  // ─── メイン計算 ────────────────────────────────────────────
 
  function calc() {
    const em = document.getElementById('em');
    em.textContent = '';
    if (!n1str || !n2str) { em.textContent = 'すうじをいれてね'; return; }
    const a = parseInt(n1str), b = parseInt(n2str);
    if (gop === '/' && b === 0) { em.textContent = '0ではわれないよ'; return; }
    if (gop === '-' && a < b)   { em.textContent = 'ひきざんができないよ'; return; }
  if      (gop === '+') rAdd(a, b);
    else if (gop === '-') rSub(a, b);
    else if (gop === '*') rMul(a, b);
    else                  rDiv(a, b);

    // ▼▼▼ ここから追加 ▼▼▼
    // 計算できたら、入力カードを隠して「もどるボタン」を出す
    document.querySelector('.card').style.display = 'none';
    document.getElementById('back-btn').style.display = 'block';
    document.body.classList.add('answer-mode');
    window.scrollTo(0, 0); // 画面の一番上にスクロール
  }
 
  // 入力画面にもどる処理
  function backToInput() {
    document.querySelector('.card').style.display = 'flex'; // 入力カードを再び出す
    document.getElementById('back-btn').style.display = 'none'; // もどるボタンを隠す
    document.body.classList.remove('answer-mode');
    document.getElementById('hp').innerHTML = '<div style="color:#9E8F7D; text-align:center; padding:20px;">すうじをいれて「ひっさんを みる」をおしてね！</div>';
    window.scrollTo(0, 0);
  }
  // ▲▲▲ ここまで追加 ▲▲▲

  // ─── 共通ユーティリティ ────────────────────────────────────
 
  function pad(n, w)  { return (' '.repeat(w) + n).slice(-w); }
  function pad0(n, w) { return ('0'.repeat(w) + n).slice(-w); }
  function ge()       { return `<div class="c"></div>`; }
  function gv(d, cls='cv') { return `<div class="c ${cls}">${d}</div>`; }
  function colClr(k, W) { return STEP_COLORS[(W - 1 - k) % STEP_COLORS.length]; }
 
  function gvBox(d, cls, color) {
    return `<div class="c ${cls}" style="background:${color}18;border:2px solid ${color}45;border-radius:10px;">${d}</div>`;
  }
  function gscBox(d, cls, color) {
    return `<div class="sc ${cls}" style="background:${color}25;border-radius:4px;">${d}</div>`;
  }
  function gvBorrow(orig, reduced, color) {
    const above = (reduced >= 0)
      ? `<span style="position:absolute;top:1px;right:3px;font-size:13px;font-weight:bold;color:#E91E63;line-height:1;">${reduced}</span>`
      : '';
    return `<div class="c cv" style="position:relative;background:${color}18;border:2px solid ${color}45;border-radius:10px;">` +
      above +
      `<span style="color:#bbb;text-decoration:line-through;text-decoration-color:#E91E63;text-decoration-thickness:2px;">${orig}</span>` +
      `</div>`;
  }
  function gvPP(d, carry, color) {
    return `<div class="c" style="position:relative;color:${color};font-size:22px;font-weight:600;` +
      `background:${color}18;border:2px solid ${color}45;border-radius:10px;">${d}` +
      (carry ? `<span style="position:absolute;top:1px;right:2px;font-size:11px;font-weight:bold;color:#BA7517;line-height:1;">${carry}</span>` : '') +
      `</div>`;
  }
 
  function setHP(hdrHTML, gridHTML) {
    document.getElementById('hp').innerHTML =
      `<div class="hdr">${hdrHTML}</div>` +
      `<div class="grid-scroll" tabindex="0" role="region" aria-label="ひっさん。はみでるときは よこに うごかせるよ">${gridHTML}</div>`;
  }
  function setHPFull(hdrHTML, gridHTML, stepsHTML, borderColor, answerHTML) {
    document.getElementById('hp').innerHTML =
      `<div class="hdr">${hdrHTML}</div>` +
      `<section class="answer-book notebook" aria-label="けいさんの ノート">` +
        `<div class="answer-layout">` +
          `<section class="hp-grid-wrap"><h2 class="panel-title">ひっさん</h2>` +
            `<div class="grid-scroll" tabindex="0" role="region" aria-label="ひっさん。はみでるときは よこに うごかせるよ">${gridHTML}</div>` +
          `</section>` +
          `<section class="steps-wrap"><h2 class="panel-title">けいさんの てじゅん</h2>${stepsHTML}</section>` +
        `</div>` +
        `<div class="answer-ribbon"><span>こたえは</span> <strong class="answer-value">${answerHTML}</strong><span class="answer-star" aria-hidden="true">★</span></div>` +
      `</section>`;
  }
  function makeStepCard(step, col, color, bodyHTML) {
    const special = ['ごうけい', 'さいご'].includes(col);
    const palette = [ ['#DCEFFC','#A7D5F0'], ['#E7F4DF','#BEDDAA'], ['#FFF1D8','#E8D09D'], ['#F1E6F8','#D6BDE8'], ['#FCE5E8','#EAB7BF'] ];
    const [wash, edge] = palette[(step - 1) % palette.length];
    return `<article class="step-card" style="--step-color:${color};--step-wash:${wash};--step-edge:${edge};">` +
      `<div class="step-label"><span class="step-number" aria-label="てじゅん${step}">${step}</span><small>${col}${special ? '' : 'のくらい'}</small></div>` +
      `<div class="step-body">${bodyHTML}</div></article>`;
  }

  // ─── 足し算 ────────────────────────────────────────────────
 
  function rAdd(n1, n2) {
    const res = n1 + n2;
    let W = Math.max(String(n1).length, String(n2).length, String(res).length);
    const d1 = pad0(n1, W).split('').map(Number);
    const d2 = pad0(n2, W).split('').map(Number);
    const s1 = pad(n1, W), s2 = pad(n2, W), sr = pad(res, W);
 
    const carryIn = new Array(W).fill(0), carryOut = new Array(W).fill(0), colSum = new Array(W).fill(0);
    let carry = 0;
    for (let k = W - 1; k >= 0; k--) {
      carryIn[k]  = carry;
      colSum[k]   = d1[k] + d2[k] + carry;
      carryOut[k] = Math.floor(colSum[k] / 10);
      carry = carryOut[k];
    }
    const ci = new Array(W).fill(0);
    for (let k = W - 2; k >= 0; k--) ci[k] = Math.floor((d1[k+1] + d2[k+1] + ci[k+1]) / 10);
 
    let g = `<div class="gc" style="grid-template-columns:52px repeat(${W},${CS}px);">`;
    g += `<div class="lb" style="color:#BA7517;">くり<br>上がり</div>`;
    for (let k = 0; k < W; k++) {
      const cc = colClr(k, W);
      g += (k < W-1 && ci[k] > 0) ? gscBox(ci[k], 'scr', cc) : `<div class="sc"></div>`;
    }
    g += ge();
    for (let k = 0; k < W; k++) {
      const cc = colClr(k, W);
      g += s1[k] === ' ' ? ge() : gvBox(d1[k], 'cv', cc);
    }
    g += gv('＋', 'co');
    for (let k = 0; k < W; k++) {
      const cc = colClr(k, W);
      g += s2[k] === ' ' ? ge() : gvBox(d2[k], 'cv', cc);
    }
    g += `<div style="grid-column:1/${W+2};height:3px;background:#5F4B32;width:100%;margin:2px 0;"></div>`;
    g += ge();
    for (let k = 0; k < W; k++) {
      const cc = colClr(k, W);
      g += sr[k] === ' ' ? ge() : gvBox(sr[k], 'ca', cc);
    }
    g += '</div>';
 
    let stepsHTML = '';
    for (let k = W - 1; k >= 0; k--) {
      if (k === 0 && s1[k] === ' ' && s2[k] === ' ') continue;
      const step    = W - k;
      const col     = PLACE_NAMES[W-1-k] || `第${step}`;
      const nextCol = PLACE_NAMES[W-k]   || '';
      const color   = STEP_COLORS[(step-1) % STEP_COLORS.length];
      const inC = carryIn[k], sum = colSum[k], digit = sum % 10, outC = carryOut[k];
      const eq  = inC > 0
        ? `${d1[k]} ＋ ${d2[k]} ＋ <span style="color:#BA7517;font-weight:bold;">くり上がり${inC}</span> ＝ <b>${sum}</b>`
        : `${d1[k]} ＋ ${d2[k]} ＝ <b>${sum}</b>`;
      const note = outC > 0
        ? `「<b style="color:var(--color-main);">${digit}</b>」を書いて、<span style="color:#BA7517;">${nextCol}のくらいに <b>1</b> くり上げる ↑</span>`
        : `「<b style="color:var(--color-main);">${digit}</b>」を書く`;
      stepsHTML += makeStepCard(step, col, color, `${eq}<br>${note}`);
    }
    setHPFull(`${n1} ＋ ${n2} ＝ <span class="ans">${res}</span>`, g, stepsHTML, '#FCE4EC', String(res));
  }
 
  // ─── 引き算 ────────────────────────────────────────────────
 
  function rSub(n1, n2) {
    const res = n1 - n2;
    const W   = Math.max(String(n1).length, String(n2).length);
    const d1  = pad0(n1, W).split('').map(Number);
    const d2  = pad0(n2, W).split('').map(Number);
    const s1  = pad(n1, W), s2 = pad(n2, W), sr = pad(res, W);
 
    const borrowNeeded = new Array(W).fill(0);
    const lentTo       = new Array(W).fill(0);
    const e2 = [...d1];
    for (let k = W - 1; k >= 0; k--) {
      if (e2[k] < d2[k]) { borrowNeeded[k] = 1; e2[k] += 10; if (k > 0) e2[k-1]--; }
    }
    for (let k = 1; k < W; k++) if (borrowNeeded[k]) lentTo[k-1] = 1;
 
    let g = `<div class="gc" style="grid-template-columns:52px repeat(${W},${CS}px);">`;
    g += ge();
    for (let k = 0; k < W; k++) {
      const cc = colClr(k, W);
      if (s1[k] === ' ')   g += ge();
      else if (lentTo[k])  g += gvBorrow(d1[k], e2[k], cc);
      else                 g += gvBox(d1[k], 'cv', cc);
    }
    g += gv('－', 'co');
    for (let k = 0; k < W; k++) {
      const cc = colClr(k, W);
      g += s2[k] === ' ' ? ge() : gvBox(d2[k], 'cv', cc);
    }
    g += `<div style="grid-column:1/${W+2};height:3px;background:#5F4B32;width:100%;margin:2px 0;"></div>`;
    g += ge();
    for (let k = 0; k < W; k++) {
      const cc = colClr(k, W);
      g += sr[k] === ' ' ? ge() : gvBox(sr[k], 'ca', cc);
    }
    g += '</div>';
 
    let stepsHTML = '';
    for (let k = W - 1; k >= 0; k--) {
      const step      = W - k;
      const col       = PLACE_NAMES[W-1-k]  || `第${step}`;
      const higherCol = (W-k   < PLACE_NAMES.length) ? PLACE_NAMES[W-k]   : '';
      const lowerCol  = (W-2-k >= 0 && W-2-k < PLACE_NAMES.length) ? PLACE_NAMES[W-2-k] : '';
      const color     = STEP_COLORS[(step-1) % STEP_COLORS.length];
      const origTop      = d1[k];
      const didLend      = lentTo[k];
      const didBorrow    = borrowNeeded[k];
      const effectiveTop = e2[k];
      const diff         = effectiveTop - d2[k];
      let lines = [];
      if (didLend && didBorrow) {
        lines.push(
          `${origTop} は <span style="color:#E91E63;">${higherCol}のくらいから <b>1</b> くり下げ</span>、` +
          `${lowerCol}のくらいへ <b>1</b> あげると → <b>${effectiveTop}</b>`
        );
        lines.push(`<b>${effectiveTop}</b> − <b>${d2[k]}</b> ＝ <b style="color:var(--color-main);">${diff}</b>`);
      } else if (didBorrow) {
        lines.push(`<b>${origTop}</b> から <b>${d2[k]}</b> はひけないので…`);
        lines.push(
          `<span style="color:#E91E63;">${higherCol}のくらいから <b>1</b> くり下げて</span>` +
          ` → <b>${effectiveTop}</b> − <b>${d2[k]}</b> ＝ <b style="color:var(--color-main);">${diff}</b>`
        );
      } else if (didLend) {
        const afterLend = origTop - 1;
        lines.push(`${origTop} − くり下がり<b>1</b> ＝ <b>${afterLend}</b>`);
        lines.push(`<b>${afterLend}</b> − <b>${d2[k]}</b> ＝ <b style="color:var(--color-main);">${diff}</b>`);
      } else {
        lines.push(`<b>${origTop}</b> − <b>${d2[k]}</b> ＝ <b style="color:var(--color-main);">${diff}</b>`);
      }
      stepsHTML += makeStepCard(step, col, color, lines.join('<br>'));
    }
    setHPFull(`${n1} － ${n2} ＝ <span class="ans">${res}</span>`, g, stepsHTML, '#E1F5FE', String(res));
  }
 
  // ─── かけ算 ────────────────────────────────────────────────
 
  function rMul(n1, n2) {
    const res = n1 * n2;
    const D2  = String(n2).length;
    let W = Math.max(String(res).length, String(n1).length, String(n2).length);
    const sn1 = pad(n1, W), sn2 = pad(n2, W), sr = pad(res, W);
 
    let g = `<div class="gc" style="grid-template-columns:52px repeat(${W},${CS}px); align-items: center;">`;
 
    // n1 行
    g += ge();
    for (let k = 0; k < W; k++) g += sn1[k] === ' ' ? ge() : gv(sn1[k]);
 
    // n2 行（各桁をステップカラー）
    g += gv('×', 'co');
    for (let k = 0; k < W; k++) {
      if (sn2[k] === ' ') {
        g += ge();
      } else {
        const cc = colClr(k, W);
        g += `<div class="c cv" style="background:${cc}18;border:2px solid ${cc}45;border-radius:10px;font-weight:bold;color:${cc};">${sn2[k]}</div>`;
      }
    }
 
    // 上横線（全幅：ラベル列〜右端）
    g += `<div style="grid-column:1/-1; justify-self:stretch; height:3px; background:#5F4B32; margin:4px 0;"></div>`;
 
    let stepsHTML = '';
    const s2d = String(n2).split('').map(Number);
 
    for (let i = D2 - 1; i >= 0; i--) {
      const d       = s2d[i];
      const shift   = D2 - 1 - i;
      const pp      = n1 * d;
      const stepNum = D2 - i;
      const color   = STEP_COLORS[(stepNum - 1) % STEP_COLORS.length];
      const place   = PLACE_NAMES[shift] || `${Math.pow(10, shift)}のくらい`;
      const carries = ppCarries(n1, d);
      const ppW     = W - shift;
      const ppPad   = pad(pp, ppW);
 
      g += `<div class="lb" style="color:${color}; font-weight:bold;">てじゅん${stepNum}</div>`;
      for (let k = 0; k < ppW; k++) {
        if (ppPad[k] === ' ') {
          g += ge();
        } else {
          const pfr   = ppW - 1 - k;
          const carry = (pfr > 0 && pfr < carries.length) ? carries[pfr] : 0;
          g += gvPP(ppPad[k], carry > 0 ? carry : null, color);
        }
      }
      for (let k = 0; k < shift; k++) g += ge();

      let body = `<b>${n1} × ${d} ＝ ${pp}</b> をけいさんします。<br>` +
                 `「<b style="color:${color};">${place}のくらい</b>」の列から かきはじめましょう。`;
      if (shift > 0) {
        body += `<br><small style="color:#9E8F7D;">※これは ${n1} × ${d * Math.pow(10, shift)} ＝ ${pp * Math.pow(10, shift)} という意味だよ！</small>`;
      }
      stepsHTML += makeStepCard(stepNum, place, color, body);
    }
 
    // 下横線（2桁以上のかけ算のみ）
    if (D2 > 1) {
      g += `<div style="grid-column:1/-1; justify-self:stretch; height:3px; background:#5F4B32; margin:4px 0;"></div>`;
      stepsHTML += makeStepCard(D2 + 1, "ごうけい", "var(--color-main)",
        `ひっさんで かきだした かずを すべて たすと、<br>こたえは <b>${res}</b> になります！`);
    }
 
    // 答え行
    g += `<div class="lb" style="color:var(--color-main); font-weight:bold;">こたえ</div>`;
    for (let k = 0; k < W; k++) g += sr[k] === ' ' ? ge() : gv(sr[k], 'ca');
    g += '</div>';
 
    setHPFull(`${n1} × ${n2} ＝ <span class="ans">${res}</span>`, g, stepsHTML, '#FCE4EC', String(res));
  }
 
  function ppCarries(n1, d) {
    const digits = String(n1).split('').reverse().map(Number);
    const c = new Array(digits.length).fill(0);
    let carry = 0;
    for (let k = 0; k < digits.length; k++) {
      const prod = digits[k] * d + carry;
      carry = Math.floor(prod / 10);
      if (k + 1 < digits.length) c[k + 1] = carry;
    }
    return c;
  }
 
  // ─── 割り算 ────────────────────────────────────────────────
 
  function rDiv(dvd, div) {
    const dvdS = String(dvd), N = dvdS.length;
    const quot = Math.floor(dvd / div), remF = dvd % div;
 
    let qStart = -1, tmp = 0;
    for (let i = 0; i < N; i++) {
      tmp = tmp * 10 + parseInt(dvdS[i]);
      if (tmp >= div && qStart < 0) qStart = i;
    }
    if (qStart === -1) qStart = N - 1;
 
    const steps = [];
    let cur = 0;
    for (let i = 0; i < N; i++) {
      const digit = parseInt(dvdS[i]);
      const valBefore = cur * 10 + digit;
      if (i >= qStart) {
        const q = Math.floor(valBefore / div), p = q * div, r = valBefore - p;
        steps.push({ q, p, r, ep: i, valBefore, digit });
        cur = r;
      } else {
        cur = valBefore;
      }
    }
 
    // グリッド列: [ラベル55px][割る数auto][被除数N桁×CSpx]
    const vLine = "border-left: 1px dashed rgba(244, 67, 54, 0.15);";
    let g = `<div class="gc" style="grid-template-columns: 55px auto repeat(${N},${CS}px); align-items: center;">`;

    // ── 行1：商（答え） ──
    // 列1(ラベル)・列2(割る数)は空、列3～N+2に商を表示
    g += ge(); g += ge();
    for (let i = 0; i < N; i++) {
      const s = steps.find(st => st.ep === i);
      const color = colClr(i, N);
      if (s) {
        g += `<div class="c ca" style="background:${color}12; border:2px solid ${color}45; border-radius:10px;">${s.q}</div>`;
      } else {
        g += ge();
      }
    }

    // ── 行2：割る数 ＋ ）＋ 横線 ＋ 被除数 ──
    // 列1: 空
    g += ge();
    // 列2: 割る数（右に縦線のみ → 「）」の縦棒）
    g += `<div class="c cv division-divisor" style="border-right:4px solid #5F4B32; justify-content:flex-end; padding-right:6px; font-weight:bold;">${div}</div>`;
    // 列3～N+2: 被除数（上に横線 → 「―――」）
    for (let i = 0; i < N; i++) {
      const color = colClr(i, N);
      g += `<div class="c cv division-digit" style="border-top:4px solid #5F4B32; background:${color}05; font-weight:bold;">${dvdS[i]}</div>`;
    }

    let stepsHTML = '';
    for (let i = 0; i < steps.length; i++) {
      const s = steps[i];
      const color = colClr(s.ep, N);
      const place = PLACE_NAMES[N - 1 - s.ep] || `位`;

      const pS = String(s.p), pL = pS.length;

      // ── かける行 ──
      g += `<div class="lb" style="color:${color}; opacity:0.5;">かける</div>`;
      g += ge();
      const pRow = Array(N).fill("");
      for (let d = 0; d < pL; d++) {
        const colIdx = s.ep - pL + 1 + d;
        pRow[colIdx] = `<div class="c" style="${vLine} color:${color}; opacity:0.6;">${pS[d]}</div>`;
      }
      for (let k = 0; k < N; k++) g += pRow[k] || `<div class="c" style="${vLine}"></div>`;

      // ── 横線行 ──
      // 全列を占める1行の中で横線を配置し、空セルによる行ずれを防ぐ。
      g += `<div class="division-rule">` +
        `<div style="position:absolute;right:${(N - 1 - s.ep) * (CS + 12)}px;width:${pL * (CS + 12) - 12}px;height:3px;background:${color};"></div></div>`;

      // ── ひく行 ──
      g += `<div class="lb" style="color:${color}; font-weight:bold;">ひく</div>`;
      g += ge();
      const rRow = Array(N).fill("");
      const rS = String(s.r), rL = rS.length;
      for (let d = 0; d < rL; d++) {
        const colIdx = s.ep - rL + 1 + d;
        rRow[colIdx] = `<div class="c" style="${vLine} color:${color}; font-weight:bold;">${rS[d]}</div>`;
      }
      if (i < steps.length - 1) {
        const nextDigit = dvdS[s.ep + 1];
        const nextColor = colClr(s.ep + 1, N);
        rRow[s.ep + 1] = `<div class="c" style="${vLine} color:${nextColor}; font-weight:bold; text-shadow: 0 0 5px ${nextColor}40;">${nextDigit}</div>`;
      }
      for (let k = 0; k < N; k++) g += rRow[k] || `<div class="c" style="${vLine}"></div>`;

      let body = `<b style="color:${color};">① たてる</b>： ${s.valBefore} ÷ ${div} ＝ <b>${s.q}</b> を、${place}にかきます。<br>` +
                 `<b style="color:${color};">② かける</b>： ${div} × ${s.q} ＝ <b>${s.p}</b><br>` +
                 `<b style="color:${color};">③ ひく　</b>： ${s.valBefore} － ${s.p} ＝ <b>${s.r}</b>`;
      if (i < steps.length - 1) {
        body += `<br><b style="color:${color};">④ おろす</b>： つぎの「<b>${dvdS[s.ep+1]}</b>」をおろして <b>${steps[i+1].valBefore}</b> にします。`;
      }
      stepsHTML += makeStepCard(i + 1, place, color, body);
    }

    if (remF > 0) {
      stepsHTML += makeStepCard(steps.length + 1, "さいご", "var(--color-main)",
        `さいごに のこった <b>${remF}</b> が「あまり」に なります！`);
    }

    g += '</div>';
    const ansStr = remF > 0
      ? `${quot} <span style="font-size:16px; color:#9E8F7D; margin:0 4px;">あまり</span> ${remF}`
      : String(quot);

    setHPFull(`${dvd} ÷ ${div} ＝ <span class="ans">${ansStr}</span>`, g, stepsHTML, '#E1F5FE', ansStr);
  }
</script>
</body>
</html>
